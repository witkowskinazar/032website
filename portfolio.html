<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — 032 Atelier</title>
<link href="https://fonts.googleapis.com/css2?family=Wire+One&family=Barlow+Condensed:wght@100;200;300;400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFFFFF;
    --sand: #E8E8E8;
    --warm-gray: #AAAAAA;
    --stone: #888888;
    --charcoal: #2A2A2A;
    --espresso: #1A1A1A;
    --pink: #fcb8db;
    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-body: 'Outfit', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 16px; }

  body {
    font-family: var(--font-body);
    background: var(--cream);
    color: var(--charcoal);
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* ── NAV ── */
  nav {
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 100;
    padding: 1.5rem 3rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(20px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.04);
  }

  .logo {
    font-family: 'Wire One', sans-serif;
    font-size: 2rem;
    font-weight: 400;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--charcoal);
    text-decoration: none;
    transition: color 0.3s;
  }

  .logo:hover { color: var(--pink); }

  .home-btn {
    font-family: 'Wire One', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--charcoal);
    transition: color 0.3s;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .home-btn svg {
    width: 16px; height: 16px;
    stroke: currentColor; fill: none; stroke-width: 1.5;
    transition: transform 0.3s;
  }

  .home-btn:hover { color: var(--pink); }
  .home-btn:hover svg { transform: translateX(-3px); }

  /* ── PROJECT LIST ── */
  .project-list-section {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8rem 3rem 4rem;
  }

  .project-list {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
    text-align: center;
  }

  .project-word {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 200;
    color: var(--charcoal);
    cursor: pointer;
    text-decoration: none;
    line-height: 1.2;
    transition: color 0.3s;
    user-select: none;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-size: clamp(1.1rem, 2vw, 1.6rem);
    display: block;
  }

  .project-word:hover { color: var(--pink); }

  /* ── GALLERY LIGHTBOX ── */
  .gallery-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(255,255,255,0.97);
    display: none;
    flex-direction: column;
    opacity: 0;
    transition: opacity 0.4s;
    overflow-y: auto;
  }

  .gallery-overlay.active {
    display: flex;
    opacity: 1;
  }

  .gallery-header {
    position: sticky;
    top: 0;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(10px);
    padding: 1.5rem 3rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--sand);
    z-index: 10;
  }

  .gallery-title {
    font-family: var(--font-body);
    font-size: 1.2rem;
    font-weight: 400;
    color: var(--charcoal);
    letter-spacing: 0.05em;
  }

  .gallery-close {
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'Wire One', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--stone);
    transition: color 0.3s;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .gallery-close:hover { color: var(--pink); }

  .gallery-close svg {
    width: 16px; height: 16px;
    stroke: currentColor; fill: none; stroke-width: 1.5;
  }

  .gallery-grid {
    padding: 3rem;
    columns: 3;
    column-gap: 1.2rem;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
  }

  .gallery-grid-item {
    break-inside: avoid;
    margin-bottom: 1.2rem;
    overflow: hidden;
    cursor: zoom-in;
  }

  .gallery-grid-item img {
    width: 100%;
    display: block;
    filter: grayscale(100%);
    transition: filter 0.5s, transform 0.5s;
  }

  .gallery-grid-item:hover img {
    filter: grayscale(0%);
    transform: scale(1.02);
  }

  /* Placeholder boxes when no images yet */
  .gallery-placeholder-box {
    width: 100%;
    background: var(--sand);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 0.6rem;
    padding: 3rem 1rem;
  }

  .gallery-placeholder-box svg {
    width: 28px; height: 28px;
    stroke: var(--warm-gray); fill: none; stroke-width: 1;
  }

  .gallery-placeholder-box span {
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--warm-gray);
  }

  /* ── FULLSCREEN IMAGE ── */
  .fullscreen-overlay {
    position: fixed;
    inset: 0;
    z-index: 300;
    background: rgba(0,0,0,0.92);
    display: none;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
  }

  .fullscreen-overlay.active { display: flex; }

  .fullscreen-overlay img {
    max-width: 90vw;
    max-height: 90vh;
    object-fit: contain;
  }

  .fullscreen-close {
    position: absolute;
    top: 2rem; right: 2rem;
    background: none; border: none; cursor: pointer;
  }

  .fullscreen-close svg {
    width: 24px; height: 24px;
    stroke: white; fill: none; stroke-width: 1.5;
  }

  .fullscreen-nav {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 1rem;
  }

  .fullscreen-nav svg {
    width: 32px; height: 32px;
    stroke: white; fill: none; stroke-width: 1.5;
    transition: stroke 0.3s;
  }

  .fullscreen-nav:hover svg { stroke: var(--pink); }
  .fullscreen-prev { left: 1rem; }
  .fullscreen-next { right: 1rem; }

  /* ── FOOTER ── */
  footer {
    padding: 2rem 3rem;
    border-top: 1px solid var(--sand);
    display: flex;
    justify-content: space-between;
  }

  footer span { font-size: 0.75rem; color: var(--warm-gray); }

  /* ── RESPONSIVE ── */
  @media (max-width: 900px) {
    .project-list-section { padding: 7rem 2rem 4rem; }
    nav { padding: 1rem 1.5rem; }
    .gallery-grid { columns: 2; padding: 2rem 1.5rem; }
  }

  @media (max-width: 600px) {
    .gallery-grid { columns: 1; }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">032 Atelier</a>
  <a href="index.html" class="home-btn">
    <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Home
  </a>
</nav>

<!-- PROJECT LIST -->
<div class="project-list-section">
  <div class="project-list">
    <a class="project-word" onclick="openGallery('project1', 'Banacha')">Banacha</a>
    <a class="project-word" onclick="openGallery('project2', 'Obriy')">Obriy</a>
    <a class="project-word" onclick="openGallery('project3', 'Białoruska')">Białoruska</a>
    <a class="project-word" onclick="openGallery('project4', 'Jerzmanowskiego')">Jerzmanowskiego</a>
    <a class="project-word" onclick="openGallery('project5', 'San Marko')">San Marko</a>
    <a class="project-word" onclick="openGallery('project6', 'Dąbrowa')">Dąbrowa</a>
    <a class="project-word" onclick="openGallery('project7', 'Tatarska')">Tatarska</a>
    <a class="project-word" onclick="openGallery('project8', 'AuRoom City')">AuRoom City</a>
  </div>
</div>

<footer>
  <span>&copy; 2026 032 Atelier. All rights reserved.</span>
</footer>

<!-- GALLERY OVERLAY -->
<div class="gallery-overlay" id="galleryOverlay">
  <div class="gallery-header">
    <span class="gallery-title" id="galleryTitle">Project</span>
    <button class="gallery-close" onclick="closeGallery()">
      <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      Close
    </button>
  </div>
  <div class="gallery-grid" id="galleryGrid"></div>
</div>

<!-- FULLSCREEN IMAGE OVERLAY -->
<div class="fullscreen-overlay" id="fullscreenOverlay" onclick="closeFullscreen()">
  <button class="fullscreen-close" onclick="closeFullscreen()">
    <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
  </button>
  <button class="fullscreen-nav fullscreen-prev" onclick="event.stopPropagation(); navigateFull(-1)">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <img id="fullscreenImg" src="" alt="">
  <button class="fullscreen-nav fullscreen-next" onclick="event.stopPropagation(); navigateFull(1)">
    <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
  </button>
</div>

<script>
  /*
  ─────────────────────────────────────────────────────
  HOW TO ADD PHOTOS FOR EACH PROJECT:
  
  In the `projects` object below, add image paths
  for each project. Example:
  
  project1: {
    images: [
      'images/p1-1.jpg',
      'images/p1-2.jpg',
      'images/p1-3.jpg',
    ]
  }
  
  Leave images: [] if no photos yet — placeholders show.
  ─────────────────────────────────────────────────────
  */
  const projects = {
    project1: { images: [ /* 'images/banacha-1.jpg', ... */ ] },
    project2: { images: [ /* 'images/obriy-1.jpg', ... */ ] },
    project3: { images: [ /* 'images/bialoruska-1.jpg', ... */ ] },
    project4: { images: [ /* 'images/jerzmanowskiego-1.jpg', ... */ ] },
    project5: { images: [ /* 'images/sanmarko-1.jpg', ... */ ] },
    project6: { images: [ /* 'images/dabrowa-1.jpg', ... */ ] },
    project7: { images: [ /* 'images/tatarska-1.jpg', ... */ ] },
    project8: { images: [ /* 'images/auroom-1.jpg', ... */ ] },
  };

  const placeholderCounts = {
    project1: 6, project2: 6, project3: 6,
    project4: 6, project5: 6, project6: 6,
    project7: 6, project8: 6,
  };

  let currentImages = [];
  let fullscreenIndex = 0;

  function openGallery(projectId, title) {
    const overlay = document.getElementById('galleryOverlay');
    const grid = document.getElementById('galleryGrid');
    const titleEl = document.getElementById('galleryTitle');

    titleEl.textContent = title;
    grid.innerHTML = '';
    currentImages = [];

    const imgs = projects[projectId]?.images || [];

    if (imgs.length > 0) {
      imgs.forEach((src, i) => {
        currentImages.push(src);
        const item = document.createElement('div');
        item.className = 'gallery-grid-item';
        item.innerHTML = `<img src="${src}" alt="${title} — ${i + 1}">`;
        item.addEventListener('click', () => openFullscreen(i));
        grid.appendChild(item);
      });
    } else {
      // Show placeholders
      const count = placeholderCounts[projectId] || 6;
      for (let i = 0; i < count; i++) {
        const item = document.createElement('div');
        item.className = 'gallery-grid-item';
        item.innerHTML = `
          <div class="gallery-placeholder-box" style="height:${180 + (i % 3) * 80}px">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            <span>Add image ${i + 1}</span>
          </div>`;
        grid.appendChild(item);
      }
    }

    overlay.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeGallery() {
    document.getElementById('galleryOverlay').classList.remove('active');
    document.body.style.overflow = '';
  }

  function openFullscreen(index) {
    if (currentImages.length === 0) return;
    fullscreenIndex = index;
    document.getElementById('fullscreenImg').src = currentImages[index];
    document.getElementById('fullscreenOverlay').classList.add('active');
  }

  function closeFullscreen() {
    document.getElementById('fullscreenOverlay').classList.remove('active');
  }

  function navigateFull(dir) {
    fullscreenIndex = (fullscreenIndex + dir + currentImages.length) % currentImages.length;
    document.getElementById('fullscreenImg').src = currentImages[fullscreenIndex];
  }

  document.addEventListener('keydown', (e) => {
    if (document.getElementById('fullscreenOverlay').classList.contains('active')) {
      if (e.key === 'Escape') closeFullscreen();
      if (e.key === 'ArrowLeft') navigateFull(-1);
      if (e.key === 'ArrowRight') navigateFull(1);
    } else if (document.getElementById('galleryOverlay').classList.contains('active')) {
      if (e.key === 'Escape') closeGallery();
    }
  });

  // Set page title based on saved language
  const lang = localStorage.getItem('lang') || 'en';
  const titles = { en: 'Projects', pl: 'Wnętrza', ua: 'Інтер\'єри' };
  if (titles[lang]) document.title = titles[lang] + ' — 032 Atelier';
</script>

</body>
</html>
